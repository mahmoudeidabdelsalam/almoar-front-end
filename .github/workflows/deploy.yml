name: Deploy Almoar Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: artlanguage-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Artlanguage Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      # 1. Prepare SSH
      - name: Setup SSH
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$SSH_KEY_B64" ]; then
            echo "Missing DEPLOY_SSH_KEY_B64 secret"
            exit 1
          fi

          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "Missing DEPLOY_KNOWN_HOSTS secret"
            exit 1
          fi

          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH configuration completed."

      # 2. Test SSH connection
      - name: Test SSH Connection
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH connection successful"'

      # 3. Deploy application
      - name: Deploy to Artlanguage
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'

          set -euo pipefail

          PROJECT_DIR="/home/art/apps/artlanguage-frontend"
          NODE_BIN="/opt/cpanel/ea-nodejs22/bin"
          SERVICE_NAME="artlanguage-frontend.service"

          export PATH="$NODE_BIN:$PATH"

          echo "Checking Node.js version..."
          node -v
          npm -v

          cd "$PROJECT_DIR"

          echo "Fetching latest changes..."
          git fetch origin main
          git reset --hard origin/main

          echo "Installing dependencies..."
          npm ci

          echo "Building application..."
          npm run build

          echo "Restarting Artlanguage application..."
          sudo -n /usr/bin/systemctl restart "$SERVICE_NAME"

          echo "Checking application service..."
          sudo -n /usr/bin/systemctl is-active --quiet "$SERVICE_NAME"

          echo "Checking local application response..."
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3001/ar > /dev/null; then
              echo "Application is responding successfully."
              break
            fi

            if [ "$i" -eq 15 ]; then
              echo "Application health check failed."
              sudo -n /usr/bin/systemctl status "$SERVICE_NAME" --no-pager -l
              exit 1
            fi

            sleep 2
          done

          echo "Deployment completed successfully."

          REMOTE