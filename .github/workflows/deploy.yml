name: Deploy OHC Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ohc-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to OHC WHM Server
    runs-on: ubuntu-latest

    steps:
      # 1. Prepare SSH
      - name: Setup SSH
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$SSH_KEY_B64" ]; then
            echo "Missing DEPLOY_SSH_KEY_B64 secret"
            exit 1
          fi

          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "Missing DEPLOY_KNOWN_HOSTS secret"
            exit 1
          fi

          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH configuration completed."

      # 2. Test SSH connection
      - name: Test SSH Connection
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH connection successful" && whoami'

      # 3. Deploy application
      - name: Deploy to OHC
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'

          set -euo pipefail

          PROJECT_DIR="/home/ohcsa/public_html"
          NODE_BIN="/opt/cpanel/ea-nodejs22/bin"

          export PATH="$NODE_BIN:$PATH"

          echo "===== SERVER CHECK ====="

          whoami
          node -v
          npm -v

          if [ "$(whoami)" != "ohcsa" ]; then
            echo "ERROR: Incorrect SSH user"
            exit 1
          fi

          cd "$PROJECT_DIR"

          echo "===== GIT UPDATE ====="

          git fetch origin main
          git reset --hard origin/main

          echo "===== INSTALL DEPENDENCIES ====="

          npm ci

          echo "===== BUILD NEXT.JS ====="

          npm run build

          echo "===== RESTART PASSENGER ====="

          mkdir -p tmp
          touch tmp/restart.txt

          echo "Passenger restart triggered."

          echo "===== APPLICATION HEALTH CHECK ====="

          for i in $(seq 1 20); do
            if curl -fsSL --max-time 15 \
              https://ohc.sa/ar \
              -o /dev/null; then

              echo "Application is responding successfully."
              break
            fi

            if [ "$i" -eq 20 ]; then
              echo "Application health check failed."
              exit 1
            fi

            sleep 3
          done

          echo "===== DEPLOYMENT COMPLETED ====="

          REMOTE
