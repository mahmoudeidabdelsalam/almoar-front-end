
name: Deploy Almoar Frontend

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: almoar-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      # 1. Prepare SSH
      - name: Setup SSH
        env:
          SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -z "$SSH_KEY_B64" ]; then
            echo "Missing DEPLOY_SSH_KEY_B64 secret"
            exit 1
          fi

          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "Missing DEPLOY_KNOWN_HOSTS secret"
            exit 1
          fi

          printf '%s' "$SSH_KEY_B64" | base64 --decode > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Validate private key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          echo "SSH configuration completed."

      # 2. Test SSH connection
      - name: Test SSH Connection
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'echo "SSH connection successful"'

      # 3. Deploy application
      - name: Deploy to Hostinger
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -e

          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'

          set -euo pipefail

          PROJECT_DIR="/home/alomarfront/public_html"
          NODE_BIN="/opt/cpanel/ea-nodejs22/bin"

          # Ensure Node 22 is used by every command
          export PATH="$NODE_BIN:$PATH"

          echo "Checking Node.js version..."
          node -v
          npm -v

          cd "$PROJECT_DIR"

          echo "Fetching latest changes..."
          git fetch origin main
          git reset --hard origin/main

          echo "Installing dependencies..."
          "$NODE_BIN/npm" ci

          echo "Building application..."
          "$NODE_BIN/node" "$PROJECT_DIR/node_modules/next/dist/bin/next" build

          echo "Restarting application..."
          sudo -n /usr/bin/systemctl restart alomarfront.service

          echo "Checking application service..."
          sudo -n /usr/bin/systemctl is-active --quiet alomarfront.service

          echo "Deployment completed successfully."

          REMOTE

